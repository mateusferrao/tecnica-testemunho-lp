<style>
  :root {

  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--creme); color: var(--tinta); font: 400 17px/1.6 var(--corpo); font-variant-numeric: lining-nums; overflow-x: hidden; }

  .marca { text-align: center; font: 600 11px/1.3 var(--corpo); letter-spacing: .22em; color: var(--bronze); }

  .progresso span { display: block; height: 100%; width: 0; background: var(--ouro); transition: width .35s ease; }

  /* Tela */
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 48px; }
  .tela { animation: entra .35s ease both; }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .vozes { margin-top: 16px; display: grid; gap: 10px; }
  .vozes blockquote { margin: 0; padding: 12px 14px; border-left: 3px solid var(--ouro); background: #fff; border-radius: 0 12px 12px 0; }
  .vozes blockquote p { margin: 0; font: italic 500 16px/1.4 var(--titulo); color: var(--tinta); }
  .vozes cite { display: block; margin-top: 6px; font: 600 11px/1.3 var(--corpo); font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--bronze); }

  /* Âncora */
  .total { font: 500 clamp(38px, 11vw, 48px)/1.05 var(--titulo); color: var(--bronze); margin: 14px 0 2px; }
  .cursos { list-style: none; margin: 14px 0 0; padding: 0; }

  .cursos li span:last-child { color: var(--tinta-suave); text-align: right; }
  .destaque { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: #fbf6ee; border: 1px solid var(--creme-2); font-size: 16px; color: var(--tinta); }
  .destaque b { font-weight: 600; }

  /* WhatsApp */
  .campo { margin-top: 20px; }
  .campo label { display: block; font: 600 13px/1.3 var(--corpo); letter-spacing: .06em; color: var(--bronze); margin-bottom: 8px; }
  .campo input { width: 100%; min-height: 58px; padding: 14px 16px; border: 1px solid var(--linha); border-radius: 14px; background: #fff; font: 500 20px/1.2 var(--corpo); color: var(--tinta); letter-spacing: .02em; }
  .campo input:focus { outline: none; border-color: var(--ouro); box-shadow: 0 0 0 3px rgba(201, 164, 106, .25); }
  .campo.erro input { border-color: #b4483b; }
  .campo .msg { display: none; margin-top: 8px; font-size: 14px; color: #b4483b; }
  .campo.erro .msg { display: block; }

  /* Resultado */
  .res-topo { text-align: center; margin-bottom: 30px; }
  .res-topo h1 { margin-top: 6px; }
  .ingresso { position: relative; background: #fff; border: 2px solid var(--ouro); border-radius: 20px; box-shadow: var(--sombra); padding: 24px 18px 20px; }
  .selo { position: absolute; top: -12px; left: 18px; padding: 4px 10px; border-radius: 999px; background: var(--cacau); color: var(--ouro); font: 600 11px/1.3 var(--corpo); letter-spacing: .12em; text-transform: uppercase; }
  .ingresso h2 { font-size: 30px; }
  .ingresso .desc { margin-top: 8px; font-size: 15px; }
  .preco { margin-top: 14px; }
  .preco small { display: block; font-size: 14px; color: var(--tinta-suave); }

  .preco .vista { font-size: 14px; color: var(--tinta-suave); }
  .lote { margin-top: 10px; font-size: 14px; color: var(--bronze); font-weight: 500; }
  .lote [data-contador] { font-variant-numeric: tabular-nums lining-nums; font-weight: 600; }
  .itens { list-style: none; margin: 16px 0 18px; padding: 0; }
  .itens li { position: relative; padding: 7px 0 7px 26px; font-size: 15px; color: var(--tinta); border-bottom: 1px solid var(--linha); }
  .itens li:last-child { border-bottom: 0; }
  .itens li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 12px; height: 7px; border-left: 2px solid var(--ouro-escuro); border-bottom: 2px solid var(--ouro-escuro); transform: rotate(-45deg); }
  .garantia { margin-top: 12px; font-size: 14px; text-align: center; color: var(--tinta-suave); }
  .outro { margin-top: 14px; background: #fff; border: 1px solid var(--linha); border-radius: 16px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
  .outro p { margin: 0; font-size: 15px; color: var(--tinta); }
  .outro small { display: block; font-size: 13px; color: var(--tinta-suave); }
  .outro .btn { width: auto; min-height: 46px; padding: 10px 16px; font-size: 14px; }
  .duvida { margin-top: 22px; text-align: center; font-size: 15px; }

  h1, h2, h3, .frase-pal p, .vozes blockquote p, .total, .preco .parcela, .sim h2 { font-variant-numeric: lining-nums; }

  .rodape { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; text-align: center; font-size: 12px; color: var(--tinta-suave); }

  @media (min-width: 600px) { main { padding-top: 32px; } .cartao { padding: 28px 26px; } }
  @media (prefers-reduced-motion: reduce) { .tela { animation: none; } .progresso span { transition: none; } }
</style>

<script>
(function () {
  /* ---------- Pixel do Meta ---------- */
  if (CONFIG.pixelId) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq("init", CONFIG.pixelId);
    fbq("track", "PageView");
  }
  const track = (...a) => { try { window.fbq && fbq(...a); } catch (e) {} };

  /* ---------- Lote vigente (mesma regra da LP) ---------- */
  const agora = new Date();
  let iLote = CONFIG.loteForcado ?? CONFIG.lotes.findIndex(l => agora <= new Date(l.fim));
  if (iLote < 0) iLote = CONFIG.lotes.length - 1;
  const lote = CONFIG.lotes[iLote];
  const prox = CONFIG.lotes[iLote + 1];
  const fmt = n => n.toLocaleString("pt-BR");
  const ING = {
    vip: { nome: "VIP", preco: CONFIG.vip.preco, checkout: CONFIG.vip.checkout },
    profissional: { nome: "Profissional", preco: lote.profissional.preco, checkout: lote.profissional.checkout, depois: prox && prox.profissional.preco },
    estudante: { nome: "Estudante", preco: lote.estudante.preco, checkout: lote.estudante.checkout, depois: prox && prox.estudante.preco }
  };
  const parcela = tipo => CONFIG.parcelas[ING[tipo].preco] || "";

  /* ---------- UTMs e links de checkout ---------- */
  const params = new URLSearchParams(location.search);
  const linkCheckout = tipo => {
    const url = new URL(ING[tipo].checkout);
    params.forEach((v, k) => { if (k.startsWith("utm_") || k === "src" || k === "sck" || k === "fbclid") url.searchParams.set(k, v); });
    if (!url.searchParams.get("utm_content")) url.searchParams.set("utm_content", "quiz");
    return url.toString();
  };
  const linkWhats = texto => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`;

  /* ---------- Estado (volta para a mesma tela se recarregar) ---------- */
  const CHAVE = "tt_quiz_v2";
  const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : "q" + Date.now() + Math.random().toString(16).slice(2));
  let E = null;
  try { E = JSON.parse(sessionStorage.getItem(CHAVE) || "null"); } catch (e) {}
  // Voltou do checkout em outra aba: recupera o resultado salvo no clique (vale 48 h)
  if (!E) try { const v = JSON.parse(localStorage.getItem(CHAVE) || "null"); if (v && v.e && Date.now() - v.t < 1728e5) E = v.e; } catch (e) {}
  if (!E || !E.atual) E = { atual: "capa", pilha: [], r: {}, whatsapp: "", eventId: novoId(), enviado: {} };
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const salva = () => { try { sessionStorage.setItem(CHAVE, JSON.stringify(E)); } catch (e) {} };

  /* ---------- Tags para o ManyChat ---------- */
  const TAG = {
    area: { biomedicina: "TT · Biomedicina", odontologia: "TT · Odontologia", medicina: "TT · Medicina", outra: "TT · Outra área da saúde", graduacao: "TT · Graduação" },
    tempo: { ate2: "TT · Até 2 anos", "2a5": "TT · 2 a 5 anos", mais5: "TT · 5+ anos" },
    aprende: { online: "TT · Aprende on-line", presencial: "TT · Aprende presencial", congressos: "TT · Aprende congressos", mentoria: "TT · Aprende mentoria" },
    dor: { tecnica: "TT · Dor técnica", intercorrencia: "TT · Dor intercorrência", avaliacao: "TT · Dor avaliação", clinica: "TT · Dor clínica", proposito: "TT · Dor propósito" },
    fe: { sim: "TT · Fé sim", asvezes: "TT · Fé às vezes", nao: "TT · Fé não" },
    objecao: { valor: "TT · Objeção valor", viagem: "TT · Objeção viagem", data: "TT · Objeção data", nivel: "TT · Objeção nível", nada: "TT · Sem objeção" }
  };
  const indicado = () => {
    if (E.r.area === "graduacao") return "estudante";
    if (E.r.tempo === "mais5" || E.r.objecao === "nada") return "vip";
    return "profissional";
  };
  const tagsAtuais = final => {
    const t = ["TT · Quiz lead"];
    Object.keys(TAG).forEach(k => { if (E.r[k] && TAG[k][E.r[k]]) t.push(TAG[k][E.r[k]]); });
    if (final) { t.push("TT · Indicado " + ING[indicado()].nome); t.push("TT · Viu resultado"); }
    return t;
  };

  /* ---------- Envio do lead ao n8n (sem token na página) ---------- */
  const cookie = n => (document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)")) || [])[1] || "";
  const fbc = () => cookie("_fbc") || (params.get("fbclid") ? `fb.1.${Date.now()}.${params.get("fbclid")}` : "");
  const sha256 = async txt => {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (e) { return ""; }
  };
  const enviar = async etapa => {
    if (!CONFIG.webhookLead || !E.whatsapp) return;
    const chave = etapa + ":" + E.whatsapp;
    if (E.enviado[chave]) return;
    E.enviado[chave] = 1; salva();
    const final = etapa === "resultado";
    const corpo = {
      etapa,
      whatsapp: E.whatsapp,
      nome: E.nome || "",
      ph: await sha256("55" + E.whatsapp),
      event_id: E.eventId,
      fbp: cookie("_fbp"),
      fbc: fbc(),
      url: location.href,
      respostas: E.r,
      indicado: final ? ING[indicado()].nome : "",
      tags: tagsAtuais(final),
      utm: { source: params.get("utm_source") || "", medium: params.get("utm_medium") || "", campaign: params.get("utm_campaign") || "", content: params.get("utm_content") || "quiz", term: params.get("utm_term") || "" }
    };
    try {
      fetch(CONFIG.webhookLead, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: JSON.stringify(corpo) });
    } catch (e) {}
  };

  /* ---------- Conteúdo fixo ---------- */
  const PAL = [

  const DIAG = {
    tecnica: ["Você sabe a técnica. Falta segurança na hora de decidir.", ["Quatro técnicas aplicadas ao vivo, do começo ao fim", "O porquê de cada escolha, explicado em voz alta", "Como quatro especialistas decidem, cada um na sua técnica"]],
    intercorrencia: ["O medo de errar está decidindo por você.", ["Cada etapa da aplicação acompanhada ao vivo, sem edição", "O raciocínio de quem tem anos de prática, a cada decisão", "No testemunho, o que pesou no caminho de cada palestrante"]],
    avaliacao: ["Você conhece as técnicas. Falta clareza para escolher.", ["Como cada palestrante pensa a queixa antes de aplicar", "Quatro técnicas diferentes no mesmo dia, para comparar", "O raciocínio de cada escolha, explicado em voz alta"]],
    clinica: ["Sua técnica cresceu mais rápido que a sua clínica.", ["Como o Dr. Gabriel (CEO do TopFit Group) e a Dra. Pamela (3 clínicas em SP) começaram", "As decisões do caminho, contadas no testemunho de cada um", "Quatro técnicas ao vivo no mesmo dia"]],
    proposito: ["Você cresceu na técnica, e o porquê ficou para trás.", ["Quatro histórias reais de quem une técnica e fé na profissão", "Testemunhos contados por quem acabou de aplicar ao vivo", "Um dia inteiro entre profissionais da harmonização"]]
  };
  const CONTOU = {
    dor: { tecnica: "A dúvida volta na hora de aplicar.", intercorrencia: "O medo de intercorrência pesa nas suas decisões.", avaliacao: "Você fica em dúvida sobre qual técnica resolve a queixa.", clinica: "A clínica não cresce no ritmo da sua técnica.", proposito: "Falta sentido no que você faz." },
    custo: { adiar: "Isso já te fez adiar ou recusar procedimento.", cobrar: "Isso já te fez cobrar menos do que queria.", curso: "Você já fez mais um curso esperando que fosse diferente.", desistir: "Você já pensou em desistir da área.", medo: "Você tem medo de que isso aconteça." },
    aprende: { online: "Hoje você aprende mais pela tela, em cursos on-line.", presencial: "Hoje você aprende em cursos presenciais, uma técnica por vez.", congressos: "Hoje você aprende em congressos.", mentoria: "Hoje você aprende por conta própria ou na mentoria." }
  };
  const htmlResultado = () => {
    const tipo = indicado();
    const d = DIAG[E.r.dor] || DIAG.tecnica;
    const contou = [CONTOU.dor[E.r.dor], CONTOU.custo[E.r.custo], CONTOU.aprende[E.r.aprende]].filter(Boolean);
    if (grad() && E.r.dor === "tecnica") contou[0] = "Você tem medo de travar na primeira paciente.";
    if (grad() && E.r.custo === "adiar") contou[1] = "Isso já te fez adiar o começo dos atendimentos.";
    if (grad() && E.r.custo === "desistir") contou[1] = "Você já duvidou da sua escolha pela área.";
    if (grad() && E.r.custo === "curso") contou[1] = "Você já fez curso atrás de curso sem se sentir pronta.";
    const TEXTO_OUTRO = {
      vip: "Quer ficar mais perto do palco e do encontro com os palestrantes? Veja o VIP.",
      profissional: "Prefere o acesso ao dia sem os extras do VIP? Veja o Profissional.",
      estudante: "Está na graduação? Veja o ingresso Estudante, com comprovante de matrícula."
    };
    const ORDEM_OUTROS = { vip: ["profissional", "estudante"], profissional: ["vip", "estudante"], estudante: ["profissional", "vip"] };
    if (tipo === "estudante") TEXTO_OUTRO.profissional = "Já se formou ou vai se formar antes do evento? Veja o Profissional.";
    const extra = `<p class="rotulo" style="margin:26px 0 0;text-align:center">Outras opções de ingresso</p>` +
      ORDEM_OUTROS[tipo].map(t => cartaoOutro(t, TEXTO_OUTRO[t])).join("");
    const nome = E.nome ? esc(E.nome.split(" ")[0]) + ", " : "";
    return `
      <div class="res-topo"><p class="rotulo">Seu diagnóstico</p><h1>${d[0]}</h1></div>
      <div class="cartao diag">
        <h3>${nome}o que você contou</h3>
        <ul class="lista-diag">${contou.map(t => `<li>${t}</li>`).join("")}</ul>
        <h3>O que você leva do dia 14</h3>
        <ul class="itens">${d[1].map(t => `<li>${t}</li>`).join("")}</ul>
      </div>
      <p class="rotulo" style="margin:30px 0 16px;text-align:center">Para o seu momento</p>
      ${cartaoIngresso(tipo)}
      ${extra}
      <p class="duvida">Ficou com alguma dúvida? <a href="${linkWhats("Olá, fiz o teste do Técnica & Testemunho e fiquei com uma dúvida.")}" target="_blank" rel="noopener">Fale com a equipe no WhatsApp</a></p>`;
  };

  /* ---------- Countdown ---------- */
  let relogio;
  const dois = n => String(n).padStart(2, "0");
  const formata = ms => {
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
    return (d ? `${d}d ` : "") + `${dois(h)}h ${dois(m)}m ${dois(s % 60)}s`;
  };
  const ligaRelogio = () => {
    clearInterval(relogio);
    const fim = new Date(lote.fim);
    const tick = () => {
      const falta = fim - new Date();
      document.querySelectorAll("[data-contador]").forEach(el => el.textContent = falta > 0 ? formata(falta) : lote.fimTexto);
      if (falta <= 0) clearInterval(relogio);
    };
    tick(); relogio = setInterval(tick, 1000);
  };

  /* ---------- Renderização ---------- */
  const raiz = document.getElementById("quiz");
  const barra = document.querySelector("[data-progresso]");
  const btnVoltar = document.querySelector("[data-voltar]");

  function render() {
    const id = E.atual, t = T[id];
    clearInterval(relogio);
    raiz.querySelectorAll("video").forEach(v => v.pause());
    let html = "";
    if (t.tipo === "pergunta") {
      const perguntas = ORDEM.filter(k => T[k].tipo === "pergunta" && !pula(k));
      const ops = typeof t.opcoes === "function" ? t.opcoes() : t.opcoes;
      html = `<div class="cartao"><p class="rotulo">Pergunta ${perguntas.indexOf(id) + 1} de ${perguntas.length}</p><h2>${t.titulo}</h2>
        <div class="opcoes" role="group" aria-label="${t.titulo}">${ops.map(o => `<button class="opcao${E.r[t.campo] === o[0] ? " marcada" : ""}" type="button" data-valor="${o[0]}">${o[1]}</button>`).join("")}</div></div>`;
    } else if (t.tipo === "sim") {
      html = `<div class="cartao sim">${ICONE_SIM}<h2>${t.titulo}</h2><div class="acao"><button class="btn" type="button" data-ir>${t.botao}</button></div></div>`;
    } else if (t.tipo === "resultado") {
      html = htmlResultado();
    } else {
      html = t.html();
    }
    raiz.innerHTML = `<section class="tela" data-tela="${id}">${html}</section>`;

    const pos = ORDEM.indexOf(id), total = ORDEM.length - 1;
    const pct = Math.round(pos / total * 100);
    barra.style.width = pct + "%";
    barra.parentElement.setAttribute("aria-valuenow", pct);
    btnVoltar.hidden = E.pilha.length === 0 || id === "resultado";
    window.scrollTo(0, 0);

    raiz.querySelectorAll("video").forEach(v => { const p = v.play(); if (p && p.catch) p.catch(() => {}); });
    if (id !== "capa") track("trackCustom", "QuizEtapa", { etapa: id, ordem: pos });
    if (id === "resultado") {
      ligaRelogio();
      track("track", "ViewContent", { content_name: "Resultado do quiz", content_category: ING[indicado()].nome });
      enviar("resultado");
    }
    const foco = raiz.querySelector("h1, h2");
    if (foco && id !== "capa") { foco.setAttribute("tabindex", "-1"); foco.focus({ preventScroll: true }); }
  }

  function vaiPara(id) {
    E.pilha.push(E.atual);
    E.atual = id;
    salva();
    render();
  }

  raiz.addEventListener("click", ev => {
    const op = ev.target.closest("[data-valor]");
    if (op) {
      const t = T[E.atual];
      E.r[t.campo] = op.dataset.valor;
      raiz.querySelectorAll(".opcao").forEach(b => b.classList.toggle("marcada", b === op));
      setTimeout(() => vaiPara(proxima(E.atual)), 180);
      return;
    }
    if (ev.target.closest("[data-ir]")) {
      if (E.atual === "capa") track("trackCustom", "QuizInicio", {});
      vaiPara(proxima(E.atual));
      return;
    }
    const ck = ev.target.closest("[data-checkout]");
    if (ck) {
      const tipo = ck.dataset.checkout;
      track("trackCustom", "CliqueCheckout", { ingresso: tipo, value: ING[tipo].preco, currency: "BRL", origem: "quiz" });
      // Para o downsell (/online/) voltar ao resultado do quiz se a pessoa recusar
      try {
        localStorage.setItem("tt_volta", JSON.stringify({ url: location.href.split("#")[0], t: Date.now() }));
        localStorage.setItem(CHAVE, JSON.stringify({ e: E, t: Date.now() }));
      } catch (e) {}
    }
  });

  raiz.addEventListener("input", ev => {
    if (ev.target.id === "whats") ev.target.value = mascara(ev.target.value);
    if (ev.target.id === "whats" || ev.target.id === "nome") ev.target.closest(".campo").classList.remove("erro");
  });

  raiz.addEventListener("submit", ev => {
    if (!ev.target.matches("[data-form-whats]")) return;
    ev.preventDefault();
    const campoNome = ev.target.querySelector("#nome");
    const input = ev.target.querySelector("#whats");
    const nome = campoNome.value.replace(/\s+/g, " ").trim().slice(0, 40);
    const d = input.value.replace(/\D/g, "");
    const nomeOk = nome.replace(/[^\p{L}]/gu, "").length >= 2;
    const telOk = d.length >= 10 && d.length <= 11 && !/^0/.test(d);
    campoNome.closest(".campo").classList.toggle("erro", !nomeOk);
    input.closest(".campo").classList.toggle("erro", !telOk);
    if (!nomeOk || !telOk) {
      (nomeOk ? input : campoNome).focus();
      return;
    }
    E.nome = nome;
    E.whatsapp = d;
    salva();
    track("track", "Lead", { content_name: "Quiz Técnica & Testemunho" }, { eventID: E.eventId });
    enviar("lead");
    vaiPara(proxima("whats"));
  });

  btnVoltar.addEventListener("click", () => {
    if (!E.pilha.length) return;
    E.atual = E.pilha.pop();
    salva();
    render();
  });

  if (E.palIndice == null) { E.palIndice = Math.floor(Math.random() * PAL.length); salva(); }
  if (!T[E.atual]) E.atual = "capa";
  if ((!E.whatsapp || !E.nome) && ORDEM.indexOf(E.atual) > ORDEM.indexOf("whats")) E.atual = "whats";
  render();
})();
</script>
</body>
</html>
